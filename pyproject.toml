[project]
name = "agent-team"
version = "1.0.0"
description = "Local multi-agent coding team powered by Ollama – tools, memory, workflows, critique loops"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Team" }]
keywords = ["agents", "llm", "ollama", "coding", "multi-agent"]
dependencies = []

[project.scripts]
team = "team.cli:main"
agent-team = "team.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
